<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
    <title>FAULT SERVER</title>
</head>
<body>

    <nav id="sidebar" class="sidebar hidden">
        <div class="sidebar-icons" id="sidebar-icons-container">
            <div class="icon-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </div>
            <div class="icon-item plus-btn" id="plusBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div id="auth-screen">
            <a href="/api/login" class="btn-connect">CONECTAR COM DISCORD</a>
            
            <div class="auth-footer">
                <p class="project-name">© FAULT SERVER</p>
                <p class="dev-name">DEVELOPER: FAULT</p>
                
                <div class="auth-socials">
                    <a href="https://discord.gg/AGCCbEAWA" target="_blank" class="social-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M20.31 4.37a19.79 19.79 0 0 0-4.88-1.51.07.07 0 0 0-.08.03c-.21.37-.44.86-.61 1.25a18.27 18.27 0 0 0-5.49 0 12.64 12.64 0 0 0-.62-1.25.07.07 0 0 0-.08-.03A19.74 19.74 0 0 0 3.68 4.37.07.07 0 0 0 3.64 4.4C.53 9.05-.32 13.58.1 18.1a.08.08 0 0 0 .03.06 19.9 19.9 0 0 0 5.99 3.03.08.08 0 0 0 .08-.03 14.09 14.09 0 0 0 1.23-1.99.08.08 0 0 0-.04-.11 13.11 13.11 0 0 1-1.87-.89.08.08 0 0 1-.01-.13 10.29 10.29 0 0 0 .37-.29.08.08 0 0 1 .08-.01c3.93 1.79 8.18 1.79 12.06 0a.08.08 0 0 1 .08.01c.12.09.25.18.37.29a.08.08 0 0 1 0 .13 12.92 12.92 0 0 1-1.87.89.08.08 0 0 0-.04.11c.36.7.77 1.37 1.23 1.99a.08.08 0 0 0 .08.03 19.84 19.84 0 0 0 6-3.03.08.08 0 0 0 .03-.05c.5-5.09-.84-9.42-3.54-13.75a.05.05 0 0 0-.03-.03z"/>
                        </svg>
                    </a>
                    <a href="https://www.instagram.com/betinzzk7" target="_blank" class="social-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <div id="loading-screen" class="hidden">
            <div class="loader"></div>
        </div>

        <div id="main-screen" class="hidden">
            <header id="app-header">
                <div id="default-header">
                    <span id="server-title">FAULT SERVER</span>
                </div>
                <div id="selection-header" class="hidden">
                    <button id="cancel-selection">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <span id="selection-count">0</span>
                    <button id="delete-selected">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </div>
            </header>

            <div class="content" id="messages-container"></div>
            
            <div id="typing-indicator" style="padding: 5px 15px; font-size: 12px; color: #888; display: none;">
                ... <span id="typing-username"></span> está digitando...
            </div>

            <footer>
                <button id="scrollBottomBtn" class="scroll-bottom-btn hidden">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <path d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                <div class="footer-wrapper">
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    <button class="add-img-btn" id="addImgBtn">+</button>
                    <input type="search" id="msgInput" name="q" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Digite sua mensagem...">
                    
                    <button class="action-btn" id="actionBtn">
                        <svg id="icon-send" class="hidden" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                        <svg id="icon-mic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/>
                        </svg>
                    </button>
                </div>
            </footer>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>

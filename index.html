<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
    <title>FAULT SERVER</title>
</head>
<body>

            </div>
            <div class="icon-item plus-btn" id="plusBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div id="auth-screen">
            <div class="social-sidebar">
                <a href="https://discord.gg/AGCCbEAWA" target="_blank" class="social-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">

                    </svg>
                </a>
                <a href="https://www.instagram.com/betinzzk7" target="_blank" class="social-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </a>
            </div>

            <a href="/api/login" class="btn-connect">CONECTAR COM DISCORD</a>
            <div class="auth-footer">
                <p class="project-name">© FAULT SERVER</p>
                <p class="dev-name">DEVELOPER: FAULT</p>
            </div>
        </div>

        <div id="loading-screen" class="hidden">
            <div class="loader"></div>
        </div>

        <div id="main-screen" class="hidden">
            <div id="user-info">
                <span id="server-title">FAULT SERVER</span>
            </div>

            <div class="content" id="messages-container"></div>
            
            <div id="typing-indicator" style="padding: 5px 15px; font-size: 12px; color: #888; display: none;">
                ... <span id="typing-username"></span> está digitando...
            </div>
            
            <footer>
                <button id="scrollBottomBtn" class="scroll-bottom-btn hidden">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <path d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                
                <div class="footer-wrapper">
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    <button class="add-img-btn" id="addImgBtn">+</button>
                    <input type="search" id="msgInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Digite sua mensagem...">
                    
                    <button class="send-btn" id="sendBtn">
                        <span id="mic-icon">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>

                        <span id="send-icon" class="hidden">

                        </span>
                    </button>
                </div>
            </footer>
        </div>

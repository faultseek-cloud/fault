<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
    <title>FAULT SERVER</title>
</head>
<body>

    <nav id="sidebar" class="sidebar hidden">
        <div class="sidebar-icons" id="sidebar-icons-container">
            <div class="icon-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </div>
            <div class="icon-item plus-btn" id="plusBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div id="auth-screen">
            <a href="/api/login" class="btn-connect">CONECTAR COM DISCORD</a>
            <div class="auth-footer">
                <p class="project-name">© FAULT SERVER</p>
                <p class="dev-name">DEVELOPER: FAULT</p>
            </div>
        </div>

        <div id="loading-screen" class="hidden">
            <div class="loader"></div>
        </div>

        <div id="main-screen" class="hidden">
            <div id="user-info">
                <div class="header-left">
                    <img id="user-avatar" src="" alt="Avatar">
                </div>
                <div class="header-text">
                    <span id="server-name">FAULT SERVER</span>
                    <div class="server-status">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        <span id="user-name"></span>
                    </div>
                </div>
                <div class="header-arrow">></div>
            </div>

            <div class="content" id="messages-container"></div>
            
            <div id="typing-indicator" style="padding: 5px 15px; font-size: 12px; color: #888; display: none;">
                ... <span id="typing-username"></span> está digitando...
            </div>
            
            <footer>
                <div class="footer-wrapper">
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    
                    <button class="add-img-btn" id="addImgBtn">+</button>
                    
                    <input type="search" id="msgInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Digite sua mensagem...">
                    <button class="send-btn" id="sendBtn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </footer>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
